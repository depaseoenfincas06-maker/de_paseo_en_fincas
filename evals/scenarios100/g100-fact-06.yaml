id: g100-fact-06
title: 'Factual: Qué tan lejos queda la primera del pueblo?'
category: g100 / factual

turns:
  - user: 'Hola, busco finca en Anapoima para 10 personas del 27 al 29 de octubre de 2026'
    assert:
      - state_equals: OFFERING
      - not_contains: 'te paso con mi compañero'

  - user: 'Qué tan lejos queda la primera del pueblo?'
    assert:
      - not_contains: 'te paso con mi compañero'
      - contains_any:
          - 'min'
          - 'MIN'
          - 'minuto'
          - 'pueblo'
          - 'cerca'
